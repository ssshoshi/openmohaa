alias leanrightoff "-leanright; bind e leanrighton"
alias leanrighton "leaningoff; -leanleft; +leanright; bind e leanrightoff; bind q leanlefton"
alias leaningoff "ubkeys; reassertmovement; locationprint 100 300 Sion's_Leaning_Script_Off ; bind capslock leaningon "
alias leaningon "bkeys; reassertmovement; locationprint 100 300 Sion's_Leaning_Script_On ; bind capslock leaningoff "
alias ubkeys "bind a +moveleftT ; bind d +moverightT "
alias bkeys "bind a +mlleft ; bind d +mlright "
alias -mlright "set reassertrightcmd reassertrightoff; -moveright; wait; -leanright"
alias +mlright "set reassertrightcmd reassertrighton; +moveright; wait; +leanright"
alias -mlleft "set reassertleftcmd reassertleftoff; -moveleft; wait; -leanleft"
alias +mlleft "set reassertleftcmd reassertlefton; +moveleft; wait; +leanleft"
alias -moverightT "set reassertrightcmd reassertrightoff; -moveright"
alias +moverightT "set reassertrightcmd reassertrighton; +moveright"
alias -moveleftT "set reassertleftcmd reassertleftoff; -moveleft"
