name: "PR Title"

# Required by main's ruleset: the PR title becomes the squash commit. Its own
# workflow so a title edit reruns only this, not the builds in pr-checks.yml.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  title:
    name: "PR title"
    runs-on: ubuntu-24.04
    steps:
    - uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Matches the history: fix(render): ..., feat(cgame): ..., chore(misc): ...
        types: |
          feat
          fix
          perf
          refactor
          docs
          test
          build
          ci
          chore
          revert
        requireScope: false
        subjectPattern: ^[a-z].+[^.]$
        subjectPatternError: |
          The subject "{subject}" should start lowercase and not end with a period.
